<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0c" />

  <!-- Typography (Geist / Geist Mono / Anton) is loaded by src/redesign/tokens.css -->

  <!-- Primary SEO Meta Tags -->
  <title>ClippyMe - AI Viral Clip Generator</title>
  <meta name="description" content="Transform long-form videos into viral 9:16 vertical shorts with AI-powered scene detection, smart reframing, and automatic subtitles." />
  <meta name="author" content="ClippyMe" />
</head>

<body>
  <div id="root">
    <div id="loading-fallback" style="display:flex;align-items:center;justify-content:center;height:100vh;color:#ccc;font-family:system-ui;font-size:18px;flex-direction:column;gap:12px;background:#0a0a0c">
      <div style="font-size:28px;font-weight:bold;color:#0A81D9">ClippyMe</div>
      <div>Loading...</div>
    </div>
  </div>
  <script>
    // Catch any JS errors and display them visually
    window.addEventListener('error', function(e) {
      var el = document.getElementById('loading-fallback');
      if (el) {
        el.innerHTML = '<div style="color:#E6428D;font-size:16px;max-width:600px;text-align:center;padding:20px">' +
          '<div style="font-size:28px;margin-bottom:12px">⚠️ JS Error</div>' +
          '<div>' + (e.message || 'Unknown error') + '</div>' +
          '<div style="font-size:12px;color:#888;margin-top:8px">' + (e.filename || '') + ':' + (e.lineno || '') + '</div>' +
          '</div>';
      }
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
